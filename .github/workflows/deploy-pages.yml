name: Deploy GitHub Pages

# 主站（免备案）：push 到 main 后自动构建并发布到 GitHub Pages。
# 全程不调用 *.bat / *.ps1 / npm run dev —— 与本地开发脚本完全无关。
# 大型 HLS 媒体不在仓库内（.gitignore 排除），由 Tencent COS 提供，
# 构建时通过 .env.github 的 VITE_MEDIA_BASE_URL 注入 COS 默认域名（免备案）。
# 备案通过后可在 .env.github 切回自定义域名 media.jazimportfolio.com。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read          # 只读源码
  pages: write            # 写 Pages
  id-token: write         # 部署用 OIDC token

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 构建：Checkout → Node → npm ci → typecheck → build:github → 上传 Artifact ──
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (GitHub Pages target)
        env:
          # 私密联系方式：由仓库 Secrets 注入，源码不保存真实值（未配置则回落为占位符）
          VITE_CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          VITE_CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
          VITE_CONTACT_WECHAT: ${{ secrets.CONTACT_WECHAT }}
        run: npm run build:github

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-output/github-site

      # ── 同步静态资源到腾讯 COS（国内 CDN，页面入口 GitHub Pages + 资源 COS 秒开） ──
      # 需在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
      #   TENCENT_SECRET_ID / TENCENT_SECRET_KEY（腾讯云访问管理 → API 密钥管理 新建长期密钥）
      # secrets 未配置时在 run 内检测为空则跳过；continue-on-error 确保同步失败也不阻断 Pages 部署。
      # 注意：GitHub Actions 的 if 条件不允许使用 secrets 上下文，故用 env 传入 + shell 判断。
      - name: Sync static assets to Tencent COS
        continue-on-error: true
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          if [ -z "$TENCENT_SECRET_ID" ] || [ -z "$TENCENT_SECRET_KEY" ]; then
            echo "::warning::TENCENT_SECRET_ID / TENCENT_SECRET_KEY 未配置，跳过 COS 资源同步"
            exit 0
          fi
          set -x
          curl -sL -o /tmp/coscli https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
          chmod +x /tmp/coscli
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              secretid: "$TENCENT_SECRET_ID"
              secretkey: "$TENCENT_SECRET_KEY"
              protocol: https
            buckets:
              - name: jazimprofile-media-1465643833
                alias: jazim-media
                region: ap-guangzhou
                endpoint: cos.ap-guangzhou.myqcloud.com
          EOF
          /tmp/coscli ls cos://jazim-media -e cos.ap-guangzhou.myqcloud.com | head -20
          python3 scripts/sync-cos-assets.py deploy-output/github-site --coscli /tmp/coscli --target cos://jazim-media --endpoint cos.ap-guangzhou.myqcloud.com

  # ── 部署 ──────────────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
