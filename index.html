<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B09" />
    <!-- 显示字体：Barlow Condensed（英文超大标题，窄体高字重）+ Inter（中文正文）+ IBM Plex Mono（系统标签） -->
    <!-- 本地化字体（国内加速，替代被墙的 Google Fonts） -->
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <title>Jazim Lau — Game Motion & Video Design Portfolio</title>
    <meta
      name="description"
      content="刘俊熙（Jazim Lau）游戏动效与视频设计作品集 —— 游戏UI动效、端外产品动态设计、游戏宣发/广告/社媒视频、UE5/Unity 实时动效与 AIGC 动效工作流。"
    />
    <meta name="author" content="Jazim Lau" />
    <meta property="og:title" content="Jazim Lau — Game Motion & Video Design Portfolio" />
    <meta
      property="og:description"
      content="刘俊熙游戏动效与视频设计作品集 —— 游戏UI动效 · 端外产品动态 · 游戏视频 · 实时引擎实践。"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      /* 自诊断兜底：若 8 秒后 React 仍未挂载，直接在页面上说明原因，
         而不是留一片黑屏让人无从判断。React 挂载后会覆盖这段内容。 */
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.children.length > 0) return

          var isFile = location.protocol === 'file:'
          var title = isFile ? '需要先构建一次才能双击打开' : '开发服务器没有响应'
          var reason = isFile
            ? '你打开的是源码里的 index.html（未经编译）。在项目目录执行一次构建，然后双击 dist/index.html 即可直接打开（无需启动服务器）。'
            : '页面已加载但脚本没有挂载。可能是开发服务器未启动、端口不对，或首次编译还没结束（首次可能要十几秒）。'

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;' +
            'background:#070B09;color:#F2F3EB;font-family:Segoe UI,Microsoft YaHei UI,sans-serif">' +
            '<div style="max-width:640px">' +
            '<p style="font-family:Consolas,monospace;font-size:11px;letter-spacing:.24em;color:#FF6B3D;margin-bottom:18px">' +
            'BOOT FAILED / 启动失败</p>' +
            '<h1 style="font-size:34px;line-height:1.15;margin-bottom:14px;font-weight:700">' + title + '</h1>' +
            '<p style="line-height:1.8;color:#B1B8B1;margin-bottom:22px">' + reason + '</p>' +
            '<p style="font-family:Consolas,monospace;font-size:11px;letter-spacing:.2em;color:#8e8b9b;margin-bottom:8px">' +
            '构建一次（约 5–30 秒）</p>' +
            '<pre style="background:#101612;border:1px solid rgba(255,255,255,.14);border-left:2px solid #7557FF;' +
            'padding:16px 18px;font-family:Consolas,monospace;font-size:13px;line-height:1.9;color:#F2F3EB;' +
            'overflow-x:auto;margin-bottom:18px">cd C:\\Users\\liujunxi\\Documents\\1\\jazim-portfolio\nnpm install\nnpm run build</pre>' +
            '<p style="line-height:1.8;color:#B1B8B1">构建完成后，打开 <code style="font-family:Consolas,monospace;' +
            'color:#B8FF3D">dist/index.html</code> 即可直接双击打开，无需启动服务器。</p>' +
            '</div></div>'
        }, 8000)
      })()
    </script>

    <noscript>
      <div style="padding: 48px; color: #f3f0e9; background: #07070a; font-family: sans-serif">
        <h1>JAZIM LAU / GAME MOTION DESIGNER</h1>
        <p>本站点依赖 JavaScript 呈现动效，请在浏览器中启用 JavaScript。</p>
        <p>联系邮箱：jazimlau@yeah.net</p>
      </div>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
